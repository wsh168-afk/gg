name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Verify runtime dependencies
        run: |
          python -c "import PySide6; from PySide6 import QtCore, QtGui, QtWidgets, QtWebEngineWidgets; from google import genai; print('PySide6 OK:', PySide6.__version__); print('QtWebEngine OK'); print('google-genai OK')"

      - name: Verify Python syntax
        run: |
          python -m py_compile main.py

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TUT-AI-Studio --icon assets/tut-ai-studio.png --add-data "assets/tut-ai-studio.png;assets" --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets --hidden-import PySide6.QtWebEngineWidgets --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/TUT-AI-Studio.exe")) { throw "TUT-AI-Studio.exe was not created" }
          Get-Item "dist/TUT-AI-Studio.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUT-AI-Studio-windows
          path: dist/TUT-AI-Studio.exe
          if-no-files-found: error
          retention-days: 30
